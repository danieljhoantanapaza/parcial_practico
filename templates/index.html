{% extends 'base.html' %}

{% block title %}Inicio - Portal Académico{% endblock %}

{% block content %}
    <p>Bienvenido al portal académico.</p>

    {% if 'usuario' in session %}
        <p>Hola, <strong>{{ session['usuario'] }}</strong>!</p>
    {% else %}
        <p>Por favor, <a href="{{ url_for('login') }}">inicia sesión</a>.</p>
    {% endif %}
{% endblock %}
